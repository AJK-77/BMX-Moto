; PlatformIO Project Configuration File

[env:esp32dev]

platform = espressif32
board = esp32dev
framework = arduino

lib_deps =
    bodmer/TFT_eSPI

monitor_speed = 9600
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=3
    
lib_ldf_mode = deep+
check_skip_packages = yes

-DUSER_SETUP_LOADED=1